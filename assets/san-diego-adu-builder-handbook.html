    :root {
      --navy: #01184b;
      --gold: #f4a000;
      --page-bg: #f3f6fb;
      --border: #d8dee9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--navy);
      font-family: Arial, Helvetica, sans-serif;
    }

    .adu-handbook-wrapper {
      width: 100%;
      padding: 32px 16px 60px;
    }

    .adu-handbook-header {
      max-width: 980px;
      margin: 0 auto 28px;
      text-align: center;
    }

    .adu-handbook-header h1 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .adu-handbook-header p {
      margin: 0;
      color: #33415c;
      font-size: 17px;
    }

    .adu-handbook-header a {
      color: var(--navy);
      font-weight: 700;
    }

    .adu-pages {
      display: flex;
      flex-direction: column;
      gap: 28px;
      align-items: center;
    }

    .adu-page {
      width: min(100%, 900px);
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 8px 30px rgba(1, 24, 75, 0.14);
      overflow: hidden;
    }

    .adu-page img {
      display: block;
      width: 100%;
      height: auto;
    }

    .adu-download {
      max-width: 900px;
      margin: 32px auto 0;
      text-align: center;
    }

    .adu-download a {
      display: inline-block;
      background: var(--navy);
      color: white;
      text-decoration: none;
      font-weight: 700;
      padding: 14px 22px;
      border-radius: 8px;
    }

    .adu-download a:hover {
      background: #06286f;
    }

    @media print {
      body {
        background: white;
      }

      .adu-handbook-wrapper {
        padding: 0;
      }

      .adu-handbook-header,
      .adu-download {
        display: none;
      }

      .adu-pages {
        gap: 0;
      }

      .adu-page {
        width: 100%;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        page-break-after: always;
      }
    }
  </style>
