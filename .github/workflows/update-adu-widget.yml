name: Update ADU Monthly Widget

on:
  schedule:
    - cron: "22 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-widget:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate ADU updates JSON
        run: node scripts/update-adu-widget.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adu-updates.json
          git commit -m "chore: auto-update ADU monthly widget"
          git push
