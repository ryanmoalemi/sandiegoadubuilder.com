name: Check site

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Optimize images
        continue-on-error: true
        run: |
          python3 -m pip install --user pillow || echo "IMAGE_OPTIMIZE_FAILURE: could not install Pillow"
          node scripts/optimize-images.mjs

      - name: Check information-only site rules
        run: node scripts/check-site.mjs
